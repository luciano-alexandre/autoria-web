<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title description">
<title id="title">Exemplo visual do Resumo para Iniciantes na Web</title><desc id="description">Página simples com cabeçalho, menu, três cartões em Flexbox, lista de cuidados, aviso e tabela.</desc>
<rect width="1200" height="1100" fill="#f1f5f9"/><rect x="90" y="45" width="1020" height="1010" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<path d="M104 45h992a14 14 0 0 1 14 14v170H90V59a14 14 0 0 1 14-14z" fill="#263b6a"/>
<g font-family="Arial, sans-serif"><text x="145" y="112" fill="#fff" font-size="38" font-weight="700">Resumo para Iniciantes na Web</text><text x="145" y="154" fill="#dbe4ff" font-size="19">Conceitos e cuidados para construir suas primeiras páginas</text>
<rect x="145" y="182" width="520" height="45" rx="22" fill="#fff"/><g fill="#263b6a" font-size="16" font-weight="700"><text x="180" y="211">Conceitos</text><text x="350" y="211">Cuidados</text><text x="505" y="211">Materiais</text></g>
<text x="145" y="305" fill="#263b6a" font-size="28" font-weight="700">Conceitos fundamentais</text><text x="145" y="343" fill="#475569" font-size="17">A Internet conecta redes; a Web organiza páginas acessadas pelo navegador.</text>
<g><rect x="145" y="385" width="275" height="170" rx="10" fill="#eef2ff" stroke="#a5b4fc"/><text x="172" y="430" fill="#263b6a" font-size="25" font-weight="700">URL</text><text x="172" y="470" fill="#475569" font-size="16">Identifica o endereço</text><text x="172" y="496" fill="#475569" font-size="16">de um recurso na Web.</text>
<rect x="462" y="385" width="275" height="170" rx="10" fill="#fff7ed" stroke="#fdba74"/><text x="489" y="430" fill="#9a3412" font-size="25" font-weight="700">DNS</text><text x="489" y="470" fill="#475569" font-size="16">Localiza o servidor</text><text x="489" y="496" fill="#475569" font-size="16">associado ao domínio.</text>
<rect x="779" y="385" width="275" height="170" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/><text x="806" y="430" fill="#166534" font-size="25" font-weight="700">HTTP</text><text x="806" y="470" fill="#475569" font-size="16">Transporta requisições</text><text x="806" y="496" fill="#475569" font-size="16">e respostas.</text></g>
<text x="145" y="630" fill="#263b6a" font-size="28" font-weight="700">Cuidados ao criar uma página</text><g fill="#475569" font-size="17"><text x="160" y="675">• Use elementos semânticos.</text><text x="160" y="710">• Mantenha o código indentado.</text><text x="160" y="745">• Confira os links e os textos.</text></g>
<rect x="650" y="655" width="404" height="105" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="680" y="696" fill="#9a3412" font-size="18" font-weight="700">Atenção</text><text x="680" y="730" fill="#475569" font-size="16">Não confunda aparência com semântica.</text>
<text x="145" y="830" fill="#263b6a" font-size="28" font-weight="700">Materiais para revisar</text><rect x="145" y="860" width="909" height="50" fill="#263b6a"/><g fill="#fff" font-size="16" font-weight="700"><text x="175" y="892">CONTEÚDO</text><text x="460" y="892">O QUE REVISAR</text><text x="850" y="892">MATERIAL</text></g><rect x="145" y="910" width="909" height="45" fill="#eef2ff"/><rect x="145" y="955" width="909" height="45" fill="#fff" stroke="#cbd5e1"/><g fill="#475569" font-size="15"><text x="175" y="938">HTML</text><text x="460" y="938">Elementos semânticos</text><text x="850" y="938">Encontro 8</text><text x="175" y="983">CSS</text><text x="460" y="983">Cores e unidades</text><text x="850" y="983">Encontro 14</text></g>
</g></svg>
